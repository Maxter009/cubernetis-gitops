apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-simulator
spec:
  replicas: 1
  selector:
    matchLabels: {app: device-simulator}
  template:
    metadata:
      labels: {app: device-simulator}
    spec:
      containers:
        - name: simulator
          image: cubernetis/device-simulator:1
          imagePullPolicy: Never
          env:
            - {name: TARGET_URL, value: "http://device-app.env-rollouts.svc:80"}
            - {name: DEVICES, value: "20"}
            - {name: INTERVAL, value: "1"}
            - {name: SESSION_SECONDS, value: "10"}
            - {name: ENV_NAME, value: "env-rollouts"}
            - {name: STRATEGY, value: "GitOps + ArgoCD + Argo Rollouts - Canary (schrittweise)"}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
---
# -> http://localhost:8082
apiVersion: v1
kind: Service
metadata:
  name: device-dashboard
spec:
  type: LoadBalancer
  selector: {app: device-simulator}
  ports:
    - {name: http, port: 8082, targetPort: http}
