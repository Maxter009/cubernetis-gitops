# Blue-Slot. Startzustand: v10, nimmt den gesamten Traffic (siehe service.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-app-blue
  labels: {app: device-app, slot: blue}
spec:
  replicas: 3
  selector:
    matchLabels: {app: device-app, slot: blue}
  template:
    metadata:
      labels: {app: device-app, slot: blue}
    spec:
      containers:
        - name: app
          image: cubernetis/device-app:10
          imagePullPolicy: Never   # lokal gebautes Image aus Docker Desktop
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
