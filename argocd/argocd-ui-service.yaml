# ArgoCD-Oberflaeche dauerhaft unter https://localhost:8443 (ohne port-forward).
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-lb
  namespace: argocd
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - {name: https, port: 8443, targetPort: 8080}
